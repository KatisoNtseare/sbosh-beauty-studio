name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  mongodb-integration:
    runs-on: ubuntu-latest
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/sbosh_beauty_test?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated MongoDB replica set
        shell: bash
        run: |
          docker run --detach --name sbosh-mongodb-test --publish 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec sbosh-mongodb-test mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then break; fi
            sleep 2
          done
          docker exec sbosh-mongodb-test mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for attempt in $(seq 1 30); do
            if docker exec sbosh-mongodb-test mongosh --quiet --eval 'rs.status().myState' | grep -q 1; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not elect a primary" >&2
          exit 1
      - run: npm run test:integration
